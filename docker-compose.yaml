# Docker-Setup für ein Symfony 7.4 Projekt
# Services: php (PHP-FPM 8.4) + nginx (HTTP) + database (MariaDB)
#
# Ports nach außen:
#   - HTTP-Server:  http://localhost:8080
#   - MariaDB:      localhost:3306  (z.B. für DBeaver / TablePlus / mysql-Client)

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php
    volumes:
      # Dein Projektcode wird live in den Container gespiegelt
      - ./:/var/www/app:cached
    environment:
      # Verbindung zur Datenbank unten (Hostname = Servicename "database")
      DATABASE_URL: "mysql://app:app@database:3306/app?serverVersion=mariadb-10.11.2&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: symfony_nginx
    ports:
      # host:container  ->  links die Zahl ändern, falls 8080 belegt ist
      - "8080:80"
    volumes:
      - ./:/var/www/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mariadb:10.11
    container_name: symfony_database
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # DB-Port nach außen, damit du mit einem GUI-Tool draufkommst
      - "3306:3306"
    volumes:
      # Daten überleben "docker compose down" (nur "down -v" löscht sie)
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
